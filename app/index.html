<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>CodeNova | Service status</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #eef2ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 15% 15%, rgb(91 73 220 / 22%), transparent 38%),
          radial-gradient(ellipse at 90% 85%, rgb(22 183 166 / 14%), transparent 34%),
          #0b1020;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid rgb(180 190 255 / 16%);
        border-radius: 28px;
        background: rgb(18 25 48 / 88%);
        box-shadow: 0 28px 90px rgb(0 0 0 / 35%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #b6c0df;
        font-size: 0.9rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #7c6cff, #22c5b5);
        color: white;
        font-size: 1.15rem;
        letter-spacing: 0;
      }

      h1 {
        margin: 42px 0 14px;
        font-size: clamp(2.2rem, 8vw, 4rem);
        letter-spacing: -0.055em;
        line-height: 1.05;
      }

      .intro {
        max-width: 470px;
        margin: 0;
        color: #aab4d0;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 36px;
        padding: 18px 20px;
        border: 1px solid rgb(57 214 157 / 22%);
        border-radius: 16px;
        background: rgb(35 178 125 / 9%);
      }

      .status-dot {
        width: 11px;
        height: 11px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #40dfa2;
        box-shadow: 0 0 18px rgb(64 223 162 / 70%);
      }

      .status strong, .status span { display: block; }
      .status strong { font-size: 0.98rem; }
      .status span { margin-top: 4px; color: #9eacc2; font-size: 0.88rem; }

      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        margin-top: 30px;
        color: #8490ad;
        font-size: 0.86rem;
      }

      footer a { color: #b5aaff; text-decoration: none; }
      footer a:hover { color: white; text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark" aria-hidden="true">C</span> CodeNova</div>
      <h1>Your service is<br>up and running.</h1>
      <p class="intro">The application is online and ready to respond. This page is served by the CodeNova Python web service.</p>
      <section class="status" aria-label="Service status">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong>All systems operational</strong>
          <span>Health check is responding normally</span>
        </div>
      </section>
      <footer>
        <span>Powered by FastAPI</span>
        <a href="/healthz">Health check</a>
        <a href="/docs">API documentation</a>
      </footer>
    </main>
  </body>
</html>
