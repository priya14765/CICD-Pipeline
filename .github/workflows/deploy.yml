name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run flake8
        run: python -m flake8 app tests

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -q

  build:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    name: Deploy to Render
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Render deployment for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ needs.build.outputs.image_name }}:${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          encoded_image_url="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_URL"], safe=""))')"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]]; then
            separator="&"
          else
            separator="?"
          fi

          if ! curl --silent --fail --max-time 30 --output /dev/null \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}imgURL=${encoded_image_url}"; then
            echo "::error::Render rejected or did not receive the deployment request."
            exit 1
          fi

  failure-notice:
    name: Failure notice
    if: ${{ failure() }}
    needs: [lint, test, build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Add failure details to the run summary
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## CI/CD pipeline failed"
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Run: [View failed workflow](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})"
            echo "- Inspect the failed job logs, correct the issue, then push a fix or rerun the workflow."
          } >> "$GITHUB_STEP_SUMMARY"
